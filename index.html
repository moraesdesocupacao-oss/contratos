    document.title = `${page.label} · Ametista`;
    if (!same) {
      view2.innerHTML = "";
      view2.classList.remove("enter");
      void view2.offsetWidth;
      view2.classList.add("enter");
      view2.scrollTop = 0;
      document.scrollingElement.scrollTop = 0;
    }
    app.mounted = page.view;
    page.view.render(view2, params);
    if (!same) view2.focus({ preventScroll: true });
    updateChrome();
  }
  function refresh() {
    if (!app.page) return;
    const active = document.activeElement;
    const view2 = $("#view");
    const keep = active && view2.contains(active) && (active.id || active.name || active.dataset.keep) ? {
      sel: active.id ? `#${CSS.escape(active.id)}` : active.name ? `[name="${active.name}"]` : `[data-keep="${active.dataset.keep}"]`,
      start: active.selectionStart,
      end: active.selectionEnd
    } : null;
    const scroll = document.scrollingElement.scrollTop;
    const inner = $$("[data-scroll-keep]", view2).map((el) => [el.dataset.scrollKeep, el.scrollTop, el.scrollLeft]);
    app.mounted.render(view2, app.params, { refresh: true });
    document.scrollingElement.scrollTop = scroll;
    for (const [k, top, left] of inner) {
      const el = $(`[data-scroll-keep="${k}"]`, view2);
      if (el) {
        el.scrollTop = top;
        el.scrollLeft = left;
      }
    }
    if (keep) {
      const el = $(keep.sel, view2);
      if (el) {
        el.focus({ preventScroll: true });
        try {
          if (keep.start != null) el.setSelectionRange(keep.start, keep.end);
        } catch {
        }
      }
    }
    updateChrome();
  }
  function go2(pageId, params = {}) {
    const q2 = new URLSearchParams(params).toString();
    const target = `#/${pageId}${q2 ? `?${q2}` : ""}`;
    if (location.hash === target) mount(pageId, params);
    else location.hash = target;
  }
  self.plannerGo = go2;
  function openInbox(anchor) {
    const overdue = workingInstances().filter((i) => i.overdue).slice(0, 6);
    const upcoming = computeReminders(Date.now(), Date.now() + 24 * 36e5).slice(0, 6);
    app.inbox.forEach((n) => {
      n.read = true;
    });
    updateChrome();
    const perm = permission();
    const s = settings();
    const status2 = !s.notificationsEnabled ? "Notificações do sistema desativadas" : perm !== "granted" ? "Permissão do navegador pendente" : isActive() ? "Ativas, inclusive com o app fechado" : "Ativas enquanto o app estiver aberto";
    const html = `
    <div class="inbox">
      <div class="inbox-head"><strong>Notificações</strong><button class="link-btn" type="button" data-go-settings>Configurar</button></div>
      <p class="inbox-status ${s.notificationsEnabled && perm === "granted" ? "ok" : ""}">${icon(s.notificationsEnabled && perm === "granted" ? "bellRing" : "bellOff", 14)}${status2}</p>
      ${overdue.length ? `<h5>Atrasadas</h5>${overdue.map((i) => `<button class="inbox-item late" data-iid="${esc(i.iid)}" type="button">${icon("alert", 15)}<span><strong>${esc(i.title)}</strong><small>${esc(i.dueDate ? "Prazo: " + i.dueDate.split("-").reverse().join("/") : "")}</small></span></button>`).join("")}` : ""}
      <h5>Próximas 24 horas</h5>
      ${upcoming.length ? upcoming.map((r) => `<button class="inbox-item" data-iid="${esc(r.iid || "")}" data-url="${esc(r.url)}" type="button">${icon("clock", 15)}<span><strong>${esc(r.title)}</strong><small>${esc(r.body)} · ${fmtCountdown(r.fireAt - Date.now())}</small></span></button>`).join("") : '<p class="inbox-empty">Nenhum lembrete nas próximas 24 horas.</p>'}
      ${app.inbox.length ? `<h5>Recentes</h5>${app.inbox.slice(0, 5).map((n) => `<button class="inbox-item" data-iid="${esc(n.iid || "")}" data-url="${esc(n.url || "")}" type="button">${icon("bell", 15)}<span><strong>${esc(n.title)}</strong><small>${esc(n.body)} · ${fmtTime(wallParts(n.at).time)}</small></span></button>`).join("")}` : ""}
    </div>`;
    const el = popMenu(anchor, [{ html, bind: (d, close) => {
      d.querySelector("[data-go-settings]").onclick = () => {
        close();
        go2("configuracoes", { s: "notificacoes" });
      };
      d.querySelectorAll(".inbox-item").forEach((b) => b.onclick = () => {
        close();
        if (b.dataset.iid) openDetail2(b.dataset.iid);
        else if (b.dataset.url) location.hash = b.dataset.url;
      });
    } }], { className: "menu-wide" });
    return el;
  }
  function inAppReminder(r) {
    app.inbox.unshift({ ...r, at: Date.now(), read: false });
    app.inbox = app.inbox.slice(0, 20);
    toast(`${r.title} — ${r.body}`, { type: "info", duration: 9e3, action: r.iid ? { label: "Abrir", run: () => openDetail2(r.iid) } : null });
    updateChrome();
  }
  var SHORTCUTS = [
    ["N", "Nova tarefa"],
    ["C", "Novo compromisso"],
    ["Ctrl K ou /", "Pesquisar"],
    ["T", "Ir para hoje (calendário)"],
    ["A", "Ver tarefas atrasadas"],
    ["1 – 7", "Ir para as páginas do menu"],
    ["[", "Recolher/expandir menu"],
    ["M · S · D · L", "Calendário: mês, semana, dia, lista"],
    ["← →", "Calendário: período anterior/próximo"],
    ["Espaço ou X", "Concluir a tarefa selecionada"],
    ["E", "Editar a tarefa selecionada"],
    ["Ctrl Enter", "Salvar formulário"],
    ["Esc", "Fechar janela"],
    ["?", "Mostrar atalhos"]
  ];
  function showShortcuts() {
    openModal({ title: "Atalhos de teclado", size: "sm", body: `<dl class="shortcuts">${SHORTCUTS.map(([k, d]) => `<div><dt>${k.split(" ").map((x) => ["ou", "·", "–"].includes(x) ? `<span>${x}</span>` : `<kbd>${esc(x)}</kbd>`).join(" ")}</dt><dd>${esc(d)}</dd></div>`).join("")}</dl>` });
  }
  function onKey(e) {
    if (e.key === "Escape") {
      if (closeMenu()) return;
      if (closeTopModal()) return;
      document.body.classList.remove("nav-open");
      return;
    }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") {
      e.preventDefault();
      if (!topModal()) openSearch();
      return;
    }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "p" && app.page === "calendario") return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const tag = e.target.tagName;
    if (["INPUT", "TEXTAREA", "SELECT"].includes(tag) || e.target.isContentEditable || topModal()) return;
    const k = e.key;
    const page = PAGES.find((p) => p.key === k);
    if (page) {
      e.preventDefault();
      go2(page.id);
      return;
    }
    switch (k.toLowerCase()) {
      case "n":
        e.preventDefault();
        newTask();
        break;
      case "c":
        e.preventDefault();
        newTask({ kind: "event" });
        break;
      case "/":
        e.preventDefault();
        openSearch();
        break;
      case "t":
        e.preventDefault();
        go2("calendario", { d: today() });
        break;
      case "a":
        e.preventDefault();
        go2("tarefas", { f: "overdue" });
        break;
      case "[":
        e.preventDefault();
        toggleCollapse();
        break;
      case "?":
        e.preventDefault();
        showShortcuts();
        break;
      default:
        app.mounted?.onKey?.(e);
    }
  }
  var deferredInstall = null;
  var installState = { canInstall: false, installed: matchMedia("(display-mode: standalone)").matches || navigator.standalone === true };
  addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault();
    deferredInstall = e;
    installState.canInstall = true;
    if (app.page === "configuracoes" || app.page === "dashboard") refresh();
  });
  addEventListener("appinstalled", () => {
    installState.installed = true;
    installState.canInstall = false;
    deferredInstall = null;
    toast("Ametista foi instalado. Você pode fixá-lo na barra de tarefas.");
  });
  async function promptInstall() {
    if (!deferredInstall) return false;
    deferredInstall.prompt();
    const { outcome } = await deferredInstall.userChoice;
    deferredInstall = null;
    installState.canInstall = false;
    return outcome === "accepted";
  }
  async function registerSW() {
    if (!("serviceWorker" in navigator) || location.protocol === "file:") return;
    try {
      const reg = await navigator.serviceWorker.register("./sw.js", { scope: "./" });
      reg.addEventListener("updatefound", () => {
        const nw = reg.installing;
        nw?.addEventListener("statechange", () => {
          if (nw.state === "installed" && navigator.serviceWorker.controller) {
            toast("Nova versão disponível.", { type: "info", duration: 15e3, action: { label: "Atualizar", run: () => {
              nw.postMessage({ type: "SKIP_WAITING" });
            } } });
          }
        });
      });
      let reloading = false;
      const hadController = !!navigator.serviceWorker.controller;
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (hadController && !reloading) {
          reloading = true;
          location.reload();
        }
      });
      navigator.serviceWorker.addEventListener("message", async (e) => {
        const msg = e.data || {};
        if (msg.type === "COMPLETE" && msg.iid) {
          const inst = getInstance(msg.iid);
          if (inst && inst.status !== "done") await toggleDone(msg.iid);
        }
        if (msg.type === "OPEN" && msg.url) location.hash = msg.url.replace(/^.*#/, "#");
      });
    } catch (e) {
      console.warn("Service worker não registrado:", e);
    }
  }
  async function boot() {
    try {
      await init();
    } catch (e) {
      $("#app").innerHTML = `<div class="fatal"><h1>Não foi possível abrir seus dados</h1><p>${esc(e.message)}</p><p>Se estiver em uma janela anônima, abra o planner em uma janela normal.</p></div>`;
      $("#splash")?.remove();
      return;
    }
    applyTheme();
    wire({ form: openTaskForm, detail: openDetail2 });
    renderShell();
    applyTheme();
    subscribe((reason) => {
      if (reason === "settings") {
        applyTheme();
        applyCollapse();
      }
      refresh();
      scheduleSync();
    });
    addEventListener("hashchange", route);
    document.addEventListener("keydown", onKey);
    await route();
    setInterval(() => {
      if (!topModal() && document.visibilityState === "visible") refresh();
    }, 6e4);
    setPushActiveCheck(isActive);
    onInApp(inAppReminder);
    startScheduler();
    registerSW().then(() => {
      verifySubscription().then(() => sync().catch(() => {
      }));
    });
    setInterval(() => sync().catch(() => {
    }), 3 * 36e5);
    const splash = $("#splash");
    if (splash) {
      splash.classList.add("hide");
      setTimeout(() => splash.remove(), 500);
    }
    Promise.resolve().then(() => (init_db(), db_exports)).then((db) => db.requestPersistence());
  }
  boot();
})();

</script>
